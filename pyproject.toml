[project]
name = "bestieai"
version = "0.13.1"



description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=5.0.0",
    "chromadb>=1.5.9",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "google-auth>=2.58.0",
    "google-genai>=2.23.0",
    "google-generativeai>=0.8.6",
    "instagrapi>=3.0.2",
    "pydantic>=2.12.5",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "external: marks tests as external API live tests (deselect with -m 'not external', require -E / --external)",
]
